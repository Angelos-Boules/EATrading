<main class="client-dashboard">
    <app-top-bar (logout)="logout()"></app-top-bar>

    <!-- @if (loadingAccount()) {
    <p class="loading-text">Loading account...</p>
    } @else if (account(); as acc) { -->
    <section class="welcome-card">
        <p class="greeting">Welcome back,</p>
        <h1> Angelos </h1> 
        <!-- {{ acc.name ?? auth.user()?.email }} -->

        <div class="balance">
            <span class="balance-label">Account balance</span>
            <span class="balance-value">1,200,000 USD</span>
            <!-- {{ acc.totalBalance | number: '1.2-2' }} -->
        </div>
    </section>

    <!-- TODO: add portfolio performance graph here (ag-grid charts integration) -->

    <nav class="client-dashboard-tabs">
        <button type="button" class="tab-button" [class.active]="activeTab() === 'portfolio'"
            (click)="setTab('portfolio')">
            Portfolio
        </button>
        <button type="button" class="tab-button" [class.active]="activeTab() === 'orders'" (click)="setTab('orders')">
            Orders
        </button>
    </nav>

    @if (activeTab() === 'portfolio') {
    <section class="tab-panel">
        <app-portfolio-table [rowData]="portfolioHoldings()"></app-portfolio-table>
    </section>
    } @else if (activeTab() === 'orders') {
    <section class="tab-panel">
        <app-orders-table [rowData]="orderHistory()"></app-orders-table>
    </section>
    }
    <!-- } -->
</main>
