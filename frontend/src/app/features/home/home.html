<main class="home">
    <header class="topbar">
        <span class="brand">EA Trading</span>
        <button type="button" class="btn btn-ghost" (click)="logout()">Log out</button>
    </header>

    @if (loadingAccount()) {
    <p class="loading-text">Loading account...</p>
    } @else if (account(); as acc) {
    <section class="welcome-card">
        <p class="greeting">Welcome back,</p>
        <h1>{{ acc.name ?? auth.user()?.email }}</h1>

        <div class="balance">
            <span class="balance-label">Account balance</span>
            <span class="balance-value">{{ acc.totalBalance | number: '1.2-2' }} USD</span>
        </div>
    </section>
    }
</main>
