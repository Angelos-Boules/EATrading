<div class="json-viewer">
    <h2>Raw JSON viewer</h2>

    <div class="controls">
        <input type="text" [ngModel]="path()" (ngModelChange)="path.set($event)" placeholder="/api/endpoint" />
        <button type="button" (click)="fetch()" [disabled]="loading()">
            {{ loading() ? 'Loading...' : 'Fetch' }}
        </button>
    </div>

    @if (error()) {
    <p class="error">{{ error() }}</p>
    }

    @if (data() !== null) {
    <pre class="json-output">{{ data() | json }}</pre>
    }
</div>
